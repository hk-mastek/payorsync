<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700" role="img" aria-labelledby="t d">
<title id="t">PayorSync complete system architecture</title><desc id="d">Detailed verified flow diagram showing all client routes, APIs, AI processing, storage and implementation notes.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172554" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker><style>.h{font:700 42px Arial,sans-serif;fill:#172554}.sub{font:400 18px Arial,sans-serif;fill:#64748b}.z{font:700 16px Arial,sans-serif;letter-spacing:2px;fill:#475569}.hd{font:700 20px Arial,sans-serif;fill:#172033}.p{font:400 15px Arial,sans-serif;fill:#475569}.sm{font:400 13px Arial,sans-serif;fill:#64748b}.m{font:600 12px 'Courier New',monospace;fill:#334155}.tag{font:700 11px Arial,sans-serif;letter-spacing:1px}</style></defs>
<rect width="2400" height="1700" fill="url(#b)"/><circle cx="2250" cy="80" r="250" fill="#dbeafe" opacity=".45"/><circle cx="80" cy="1640" r="300" fill="#ede9fe" opacity=".45"/>
<text x="80" y="72" class="z" fill="#2563eb">PAYORSYNC • VERIFIED CODEBASE ARCHITECTURE</text><text x="80" y="122" class="h">Dialysis contract intelligence &amp; revenue recovery platform</text><text x="80" y="156" class="sub">Complete client, API, AI, document, search, storage and control flow — current implementation.</text>
<g filter="url(#s)"><rect x="1690" y="54" width="630" height="112" rx="18" fill="white" stroke="#e2e8f0"/><text x="1720" y="86" class="z">COLOR KEY</text><rect x="1720" y="104" width="14" height="14" rx="3" fill="#2563eb"/><text x="1742" y="116" class="sm">Client / UI</text><rect x="1880" y="104" width="14" height="14" rx="3" fill="#7c3aed"/><text x="1902" y="116" class="sm">API domain</text><rect x="2040" y="104" width="14" height="14" rx="3" fill="#d97706"/><text x="2062" y="116" class="sm">AI / document flow</text><rect x="1720" y="136" width="14" height="14" rx="3" fill="#059669"/><text x="1742" y="148" class="sm">PostgreSQL data</text><rect x="1900" y="136" width="14" height="14" rx="3" fill="#f43f5e"/><text x="1922" y="148" class="sm">Not wired / control warning</text></g>
<!-- client -->
<text x="80" y="218" class="z">01 — USER WORKSPACE (REACT 19 + TYPESCRIPT)</text>
<g filter="url(#s)"><rect x="80" y="240" width="310" height="180" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="108" y="278" class="hd">Revenue-cycle team</text><text x="108" y="309" class="p">Revenue manager • analyst</text><text x="108" y="333" class="p">Contract / policy reviewers</text><text x="108" y="370" class="sm">Current UI is unauthenticated.</text><text x="108" y="393" class="sm">Placeholder profile: Arbor Holmes.</text></g><path d="M395 330H455" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="470" y="240" width="630" height="180" rx="20" fill="white" stroke="#93c5fd" stroke-width="2"/><text x="500" y="278" class="hd">DashboardLayout shared app shell</text><text x="500" y="306" class="p">Sidebar navigation • notification/profile header • responsive Sheet menu</text><text x="500" y="333" class="p">Wouter routing • TanStack Query • shadcn/ui • Tailwind • Lucide</text><text x="500" y="370" class="sm">Global search calls /api/search: exact, prefix, partial, and Levenshtein typo-tolerant matching.</text><text x="500" y="393" class="sm">Search targets contracts, variances, and clause templates.</text></g><path d="M1105 330H1165" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="1180" y="240" width="1140" height="180" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1210" y="278" class="hd">Implemented client pages</text><text x="1210" y="311" class="m">/  Variance Dashboard          /contracts  Contract Management          /drafter + /drafter/:id  Contract Drafting</text><text x="1210" y="341" class="m">/clause-library  Clause Library   /variances  Variance Work Queue       /write-offs + /write-offs-2  Write-off Analysis</text><text x="1210" y="371" class="m">/governance  Rules, audit logs, policies         /settings  Workspace configuration</text><text x="1210" y="401" class="sm">analytics.tsx and USMap are present in source but analytics is not registered in App.tsx; only listed routes are reachable.</text></g>
<!-- api -->
<text x="80" y="490" class="z">02 — EXPRESS API &amp; BUSINESS DOMAINS (ZOD INPUT VALIDATION + DRIZZLE STORAGE)</text><path d="M1200 426V474" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="80" y="515" width="410" height="195" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/><text x="106" y="550" class="hd">Clause catalog</text><text x="106" y="580" class="m">GET/POST /api/clause-categories</text><text x="106" y="604" class="m">GET/POST /api/clauses</text><text x="106" y="628" class="m">GET/PATCH/DELETE /api/clauses/:id</text><text x="106" y="663" class="p">Templates, categories, versions,</text><text x="106" y="685" class="p">tags, compliance &amp; approval metadata.</text></g>
<g filter="url(#s)"><rect x="515" y="515" width="410" height="195" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/><text x="541" y="550" class="hd">Contracts &amp; drafting</text><text x="541" y="580" class="m">GET/POST /api/contracts</text><text x="541" y="604" class="m">GET/PATCH/DELETE /api/contracts/:id</text><text x="541" y="628" class="m">PUT /:id/clauses • POST /draft</text><text x="541" y="663" class="p">Contract + linked clause instances,</text><text x="541" y="685" class="p">payor filters and transactional draft save.</text></g>
<g filter="url(#s)"><rect x="950" y="515" width="410" height="195" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="976" y="550" class="hd">PDF contract service</text><text x="976" y="580" class="m">POST /contracts/upload-pdf</text><text x="976" y="604" class="m">GET /contract-uploads/:id</text><text x="976" y="628" class="m">PATCH decisions • add-to-library</text><text x="976" y="663" class="p">PDF extraction, clause decisions,</text><text x="976" y="685" class="p">import and negotiation-letter workflow.</text></g>
<g filter="url(#s)"><rect x="1385" y="515" width="410" height="195" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="1411" y="550" class="hd">Variance recovery</text><text x="1411" y="580" class="m">GET/POST /api/variances</text><text x="1411" y="604" class="m">GET/PATCH /api/variances/:id</text><text x="1411" y="663" class="p">Expected/actual amounts, priority,</text><text x="1411" y="685" class="p">root cause, assignee and appeals.</text></g>
<g filter="url(#s)"><rect x="1820" y="515" width="500" height="195" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="1846" y="550" class="hd">Search &amp; payor master</text><text x="1846" y="580" class="m">GET /api/search?q= (2+ characters)</text><text x="1846" y="604" class="m">GET/POST /api/payors</text><text x="1846" y="640" class="p">Returns top 5 matches per contracts,</text><text x="1846" y="662" class="p">variances and clauses, ranked by score.</text><text x="1846" y="685" class="sm">Payor type, operating states, contacts, notes.</text></g>
<!-- AI flow -->
<text x="80" y="775" class="z">03 — AI-ASSISTED CONTRACT INTELLIGENCE FLOW</text>
<g filter="url(#s)"><rect x="85" y="820" width="295" height="205" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="110" y="855" class="hd">1. Upload PDF</text><text x="110" y="885" class="p">Multer memory storage</text><text x="110" y="909" class="p">PDF only • 10 MB limit</text><text x="110" y="944" class="sm">Create upload record:</text><text x="110" y="966" class="m">pending → processing</text><text x="110" y="994" class="sm">/api/contracts/upload-pdf</text></g><path d="M385 922H460" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="475" y="820" width="295" height="205" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="500" y="855" class="hd">2. Extract text</text><text x="500" y="885" class="p">pdf-parse v2 / PDFParse</text><text x="500" y="909" class="p">Buffer → ArrayBuffer</text><text x="500" y="944" class="sm">Parse failure marks upload failed.</text><text x="500" y="970" class="sm">Text is capped at 30,000 chars</text><text x="500" y="992" class="sm">before AI analysis.</text></g><path d="M775 922H850" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="865" y="820" width="350" height="205" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="890" y="855" class="hd">3. Claude extraction</text><text x="890" y="885" class="p">Claude Sonnet 4.5 (Anthropic)</text><text x="890" y="909" class="p">Replit AI integration endpoint</text><text x="890" y="944" class="sm">Extract title/text • 1 of 11 ESRD</text><text x="890" y="966" class="sm">categories • variables • confidence •</text><text x="890" y="988" class="sm">similarity and non-standard flags.</text></g><path d="M1220 922H1295" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="1310" y="820" width="350" height="205" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/><text x="1335" y="855" class="hd">4. Normalize results</text><text x="1335" y="885" class="p">JSON.parse → jsonrepair fallback</text><text x="1335" y="909" class="p">Stores ExtractedClause JSONB</text><text x="1335" y="944" class="sm">Detects short filing, low rates,</text><text x="1335" y="966" class="sm">restrictive termination, one-sided</text><text x="1335" y="988" class="sm">indemnity, COB and missing protections.</text></g><path d="M1665 922H1740" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="1755" y="820" width="545" height="205" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text x="1780" y="855" class="hd">5. Review, negotiate &amp; reuse</text><text x="1780" y="885" class="p">Accept → import selected clauses into library as draft templates</text><text x="1780" y="910" class="p">Negotiate → GPT-5.1 generates a professional negotiation letter</text><text x="1780" y="946" class="sm">GPT-5.1 also recommends the top 3 active library clauses for a payor, jurisdiction and current drafting section.</text><text x="1780" y="975" class="m">/api/clauses/suggest • /contract-uploads/:id/negotiation-letter</text><text x="1780" y="999" class="sm">AI suggestion log supports context, selected clauses and feedback rating.</text></g>
<!-- support -->
<text x="80" y="1090" class="z">04 — SUPPORTING SERVICES, RUNTIME &amp; IMPLEMENTATION STATUS</text>
<g filter="url(#s)"><rect x="80" y="1115" width="520" height="180" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="106" y="1150" class="hd">OpenAI / Replit AI integrations</text><text x="106" y="1180" class="p">GPT-5.1: clause suggestions and negotiation letters</text><text x="106" y="1205" class="p">GPT-5.1 chat: streaming messages through SSE</text><text x="106" y="1230" class="p">gpt-image-1: POST /api/generate-image</text><text x="106" y="1264" class="sm">Credentials and base URLs supplied through AI_INTEGRATIONS_* environment settings.</text></g>
<g filter="url(#s)"><rect x="625" y="1115" width="520" height="180" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/><text x="651" y="1150" class="hd">Chat integration</text><text x="651" y="1180" class="m">GET/POST /api/conversations</text><text x="651" y="1204" class="m">GET/DELETE /api/conversations/:id</text><text x="651" y="1228" class="m">POST /api/conversations/:id/messages</text><text x="651" y="1264" class="sm">Conversation/message history is persisted; OpenAI response is streamed.</text></g>
<g filter="url(#s)"><rect x="1170" y="1115" width="520" height="180" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="1196" y="1150" class="hd">Runtime &amp; delivery</text><text x="1196" y="1180" class="p">Express JSON + urlencoded middleware and API request logger</text><text x="1196" y="1205" class="p">Vite in development; static serving in production</text><text x="1196" y="1230" class="p">HTTP server uses PORT (default 5000)</text><text x="1196" y="1264" class="sm">Batch utilities with rate limiting + SSE are exported but not invoked.</text></g>
<g filter="url(#s)"><rect x="1715" y="1115" width="605" height="180" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="1741" y="1150" class="hd">Control status — current limitation</text><text x="1741" y="1180" class="p" fill="#9f1239">No authentication, login route, Passport setup, session middleware or access enforcement is registered.</text><text x="1741" y="1210" class="p">The users table and Passport/session dependencies exist, but are currently unused.</text><text x="1741" y="1242" class="p">Governance UI is an operational screen; it does not enforce server authorization.</text><text x="1741" y="1266" class="sm">This diagram separates verified live capabilities from planned or unused pieces.</text></g>
<!-- database -->
<text x="80" y="1360" class="z">05 — POSTGRESQL DATA MODEL (DRIZZLE ORM + ZOD SCHEMAS)</text><path d="M1200 1300V1340" stroke="#059669" stroke-width="3" marker-end="url(#a)"/>
<g filter="url(#s)"><rect x="80" y="1385" width="2240" height="225" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="110" y="1422" class="hd">Core tables and relationship groups</text>
<text x="110" y="1462" class="m">users</text><text x="110" y="1485" class="sm">username/password; created/approved/assigned refs</text><text x="110" y="1524" class="m">payors</text><text x="110" y="1547" class="sm">type, state coverage, contact JSON, notes</text>
<text x="470" y="1462" class="m">clause_categories</text><text x="470" y="1485" class="sm">hierarchy, display order, active</text><text x="470" y="1524" class="m">clause_templates + clause_variables</text><text x="470" y="1547" class="sm">versions, approvals, metadata, validation rules</text>
<text x="900" y="1462" class="m">contracts + contract_clauses</text><text x="900" y="1485" class="sm">payor, dates, owner; text, customization, comments</text><text x="900" y="1524" class="m">variances</text><text x="900" y="1547" class="sm">claim, expected/actual amount, status, appeal details</text>
<text x="1320" y="1462" class="m">contract_uploads</text><text x="1320" y="1485" class="sm">file/text, extracted clauses JSONB, decisions, letter</text><text x="1320" y="1524" class="m">ai_suggestions_log</text><text x="1320" y="1547" class="sm">context, suggestions, selected clauses, feedback</text>
<text x="1745" y="1462" class="m">conversations + messages</text><text x="1745" y="1485" class="sm">chat history with cascading message delete</text><text x="1745" y="1524" class="m">11 standard clause categories</text><text x="1745" y="1547" class="sm">payment, coverage, COB, claims, disputes, quality,</text><text x="1745" y="1568" class="sm">compliance, term, liability, privacy, administrative</text>
<line x1="110" y1="1588" x2="2290" y2="1588" stroke="#bbf7d0"/><text x="110" y="1607" class="sm">Foreign keys connect payors → contracts/variances; contracts → contract clauses/variances/AI log; templates → categories/variables/contract clauses; users provide audit and assignment relationships.</text></g>
<text x="80" y="1660" class="sm">Reviewed sources: client App and DashboardLayout; server/routes.ts; server/index.ts; Replit chat/image/batch integrations; shared/schema.ts. The diagram records current code behavior, including the absence of active authentication.</text>
</svg>